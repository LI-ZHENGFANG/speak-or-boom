<!doctype html><html lang="en"><meta charset="utf-8"><title>All-scenes v4 audio verification</title>
<h1>Speak or Boom v4 browser decoder check</h1>
<p>Decodes all 1688 unique clips (1768 role mappings), checks non-silent samples and duration metadata. Does not use the microphone or change training records.</p>
<button id="check">Verify all scene audio</button><pre id="result">Ready</pre>
<script src="../voice-manifest.js?v=v4-shadow-b57f581b"></script><script>
document.getElementById('check').onclick=async function(){
  this.disabled=true;
  const output=document.getElementById('result');
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const mapped=Object.values(window.SPEAK_OR_BOOM_AUDIO.scenarios).flatMap(s=>Object.values(s).flatMap(r=>[r.agent,r.user]));
  const clips=[...new Map(mapped.map(e=>[e.src,e])).values()];
  let next=0,done=0,minRms=Infinity,maxDurationDifference=0;const errors=[];
  async function worker(){
    while(next<clips.length){const e=clips[next++];
      try{
        const response=await fetch('../'+e.src+'?v='+e.sha256);if(!response.ok)throw Error('HTTP '+response.status);
        const buffer=await ctx.decodeAudioData(await response.arrayBuffer());
        const pcm=buffer.getChannelData(0);let sum=0;for(const x of pcm)sum+=x*x;
        const rms=Math.sqrt(sum/pcm.length),difference=Math.abs(buffer.duration-e.seconds);
        if(rms<0.001)throw Error('Silent or near-silent clip');
        if(difference>0.2)throw Error('Duration mismatch '+difference);
        minRms=Math.min(minRms,rms);maxDurationDifference=Math.max(maxDurationDifference,difference);
      }catch(error){errors.push(e.src+': '+error.message);}
      done++;output.textContent='Checking '+done+'/'+clips.length;
    }
  }
  await Promise.all(Array.from({length:4},worker));await ctx.close();
  output.textContent=JSON.stringify({status:errors.length?'FAIL':'PASS',clips:done,minRms,maxDurationDifference,errors},null,2);
};
</script></html>
